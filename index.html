<!DOCTYPE html>
<html lang="ta">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>மொய் கணக்கு | Moi Tracker</title>
<style>
:root{--maroon:#f3d78a;--gold:#d9a93c;--bg:#06142e;--line:#24508f;--ink:#eaf1ff;--muted:#a9c0ea;--tm:rgba(214,160,30,.30);--close:rgba(224,71,107,.2);--panel:rgba(10,38,92,.72);--fld:#e9f1ff;--fldink:#0b1d44;--navy:#0a2252}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;font-family:"Noto Sans Tamil","Nirmala UI","Latha","Tamil MN",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);background:radial-gradient(1200px 600px at 70% -10%,#12419a 0%,rgba(18,65,154,0) 60%),linear-gradient(180deg,#071a3d,#050f26);background-attachment:fixed;line-height:1.5;font-size:15px}
.app{display:flex;min-height:100vh}
.side{width:226px;flex:none;position:sticky;top:0;height:100vh;overflow:auto;background:linear-gradient(180deg,#0a2a63 0%,#071a40 60%,#050f26 100%);border-right:1px solid #1f4c9a;padding:14px 12px;display:flex;flex-direction:column;gap:12px}
.brand{text-align:center;padding:6px 4px 12px;border-bottom:1px solid #1f4c9a}
.brand img{width:84px;height:84px;object-fit:contain;filter:drop-shadow(0 2px 6px rgba(0,0,0,.5))}
.brand .b1{font-size:1.25rem;font-weight:700;color:#f5dd8f;line-height:1.2;margin-top:2px}
.brand .b2{display:inline-block;margin-top:4px;background:linear-gradient(90deg,#f5d77f,#c8962a);color:#10224a;font-weight:700;font-size:.82rem;padding:1px 16px;border-radius:6px}
.nav{display:flex;flex-direction:column;gap:4px}
.nav button{display:flex;align-items:center;gap:11px;width:100%;background:none;border:0;color:#dbe7ff;padding:10px 12px;border-radius:10px;text-align:left;cursor:pointer;font:inherit}
.nav button svg{width:21px;height:21px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav button:hover{background:rgba(70,120,210,.25)}
.nav button.on{background:linear-gradient(90deg,#f6dc8a,#c8962a);color:#10224a;font-weight:700}
.side .deco{margin-top:auto;text-align:center;opacity:.95}.side .deco svg{width:120px}
.wrap{flex:1;min-width:0;max-width:1220px;margin:0 auto;padding:16px 20px}
header{background:linear-gradient(90deg,#0b2d6c,#0a2152 60%,#0b2d6c);color:#fff;border:1px solid #2a5bb0;border-bottom:3px solid var(--gold);border-radius:14px;padding:12px 20px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;box-shadow:0 6px 22px rgba(0,0,0,.35)}
header h1{margin:0;font-size:1.45rem;font-weight:700;color:#f5dd8f;display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
header h1 i{font-style:normal;font-weight:500;color:#cfe0ff;font-size:1.1rem;border-left:2px solid #4b7bd0;padding-left:12px}
.lang{display:flex;background:rgba(5,20,56,.7);border:1px solid #d9a93c;border-radius:999px;padding:3px}
.lang button{background:none;border:0;color:#eaf1ff;padding:5px 18px;font:inherit;border-radius:999px;cursor:pointer}
.lang button.on{background:linear-gradient(#f6dc8a,#d3a238);color:#10224a;font-weight:700}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:14px 0}
select,input,button,textarea{font:inherit}
select,input,textarea{border:1px solid #7da6e6;border-radius:9px;padding:9px 11px;background:var(--fld);color:var(--fldink);min-width:0}
::placeholder{color:#6b7fa8}
select:focus,input:focus,textarea:focus,button:focus-visible{outline:2px solid var(--gold);outline-offset:1px;border-color:var(--gold)}
.bar>label{color:#dbe7ff;font-weight:600}
.btn{background:linear-gradient(#f6dc8a,#cf9f30);color:#10224a;border:1px solid #f1d27f;border-radius:9px;padding:9px 18px;cursor:pointer;font-weight:700}
.btn:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.55;cursor:wait}
.btn.alt{background:rgba(18,58,128,.65);color:#eaf1ff;border:1px solid #3d72c8;font-weight:500}
.btn.alt:hover{background:rgba(40,90,180,.65)}
.btn.sm{padding:5px 12px;font-size:.88rem}
.sync{display:flex;flex-wrap:wrap;gap:10px;align-items:center;font-size:.86rem;color:var(--muted);margin:-4px 0 12px}
.sync b{color:#fff}
.total{display:grid;grid-template-columns:1.6fr repeat(5,1fr);gap:10px}
.total>div{background:linear-gradient(160deg,#124a9f,#0b2a63);border:1px solid #2f66c0;border-radius:12px;padding:10px 14px;box-shadow:0 4px 14px rgba(0,0,0,.3)}
.total>div:nth-child(1){background:linear-gradient(160deg,#8a6414,#3a2a08 85%);border:1.5px solid #f0c85a}
.total>div:nth-child(2){background:linear-gradient(160deg,#1a63c4,#0b2e6e)}
.total>div:nth-child(3){background:linear-gradient(160deg,#12834a,#0a3d27);border-color:#2fbf78}
.total>div:nth-child(4){background:linear-gradient(160deg,#b01f4b,#5a0f27);border-color:#e0476b}
.total>div:nth-child(5){background:linear-gradient(160deg,#6a38b8,#2c1658);border-color:#9b6fe0}
.total>div:nth-child(6){background:linear-gradient(160deg,#0e7f90,#073a45);border-color:#2fc0d3}
.total .big{font-size:2.2rem;font-weight:700;color:#fff2c4;line-height:1.15;display:block}
.total small{display:block;color:#d4e2ff;font-size:.82rem}
.stat b{font-size:1.3rem;color:#fff}
form{background:var(--panel);border:1px solid #2a5bb0;border-radius:14px;padding:14px;margin:14px 0;display:grid;grid-template-columns:repeat(6,1fr);gap:10px;align-items:end;box-shadow:0 6px 20px rgba(0,0,0,.28)}
form .ph{grid-column:1/-1;margin:0;color:#f5dd8f;font-size:1.1rem;display:flex;align-items:center;gap:8px;border-bottom:1px solid #1f4c9a;padding-bottom:8px}
form .ph svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
form label{font-size:.82rem;color:#bcd0f4;display:block;margin-bottom:2px}
form input,form select{width:100%}
.c2{grid-column:span 2}
.ac{position:relative}
.acl{position:absolute;z-index:30;left:0;right:0;top:100%;margin-top:3px;background:#fff;color:#0b1d44;border:1px solid #7da6e6;border-radius:9px;box-shadow:0 10px 28px rgba(0,0,0,.45);max-height:270px;overflow:auto;min-width:240px}
.ai{padding:8px 11px;cursor:pointer;display:flex;flex-wrap:wrap;gap:2px 8px;align-items:baseline;border-bottom:1px solid #e6edf8}
.ai:last-child{border:0}.ai:hover,.ai.on{background:#fbf0cf}
.ai span{color:#5b6b8c;font-size:.84rem}.ai em{margin-left:auto;font-style:normal;color:#8a1538;font-size:.84rem}
.tabs{display:flex;gap:4px;background:rgba(6,22,60,.8);border:1px solid #2a5bb0;border-radius:10px;padding:3px;flex-wrap:wrap}
.tabs button{border:0;background:none;color:#dbe7ff;border-radius:8px;padding:6px 14px;cursor:pointer}
.tabs button.on{background:linear-gradient(#f6dc8a,#d3a238);color:#10224a;font-weight:700}
table{width:100%;border-collapse:collapse;background:transparent;color:var(--ink)}
th,td{padding:9px 11px;border-bottom:1px solid #1d4585;text-align:left;vertical-align:top}
th{background:#0b2a63;color:#f3d78a;font-weight:600;font-size:.86rem;border-bottom:2px solid #d9a93c}
tbody tr:hover td{background:rgba(70,120,210,.14)}
td.a,th.a{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
td b{color:#fff}
tr.tm td{background:var(--tm)}tr.tm td:first-child{box-shadow:inset 5px 0 var(--gold)}
tr.cl td{background:var(--close)}tr.cl td:first-child{box-shadow:inset 5px 0 #e0476b}
.badge{display:inline-block;font-size:.76rem;border-radius:999px;padding:0 9px;margin-left:6px;background:#e0476b;color:#fff;font-weight:600}
tr.tm .badge{background:var(--gold);color:#10224a}
.tw{overflow-x:auto;background:rgba(6,24,64,.78);border:1px solid #2a5bb0;border-radius:12px;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.town{margin:16px 0 6px;padding:2px 4px;display:flex;justify-content:space-between;gap:10px;font-weight:700;color:var(--maroon);font-size:1.05rem}
.empty{padding:30px;text-align:center;color:var(--muted);background:rgba(6,24,64,.5);border:1px dashed #3d72c8;border-radius:12px}
.legend{font-size:.84rem;color:var(--muted);margin:8px 0}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-1px;margin-right:4px}
.row-act{white-space:nowrap}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:linear-gradient(#f6dc8a,#cf9f30);color:#10224a;font-weight:600;padding:9px 20px;border-radius:999px;font-size:.92rem;z-index:80;box-shadow:0 6px 18px rgba(0,0,0,.45);opacity:0;transition:opacity .15s;pointer-events:none;max-width:92vw}.toast.on{opacity:1}
.crp{background:var(--panel);border:1px solid #2a5bb0;border-top:4px solid var(--gold);border-radius:12px;padding:26px 18px;text-align:center}.crp img{width:130px;background:#fff;border-radius:10px;padding:6px}.crp h2{margin:8px 0;color:#f5dd8f;font-size:1.25rem}.crp p{margin:4px 0}.crp .m{color:var(--muted);font-size:.88rem;max-width:560px;margin:14px auto 0}
[hidden]{display:none!important}
/* dialogs: fixed header + scrolling body + fixed footer, never wider than the window */
dialog{border:1px solid #3d72c8;border-top:3px solid var(--gold);border-radius:14px;padding:0;width:min(640px,94vw);max-height:90vh;overflow:hidden;background:#0b2152;color:var(--ink);box-shadow:0 20px 60px rgba(0,0,0,.6)}
dialog[open]{display:flex;flex-direction:column}
dialog::backdrop{background:rgba(2,8,24,.7)}
.dh{padding:14px 20px 10px;border-bottom:1px solid #1f4c9a}.dh h3{margin:0;color:#f5dd8f;font-size:1.15rem}.dh p{margin:6px 0 0}
.db{padding:14px 20px;overflow-y:auto;overflow-x:hidden;flex:1 1 auto;min-height:0}
.df{padding:12px 20px;border-top:1px solid #1f4c9a;display:flex;gap:8px;justify-content:flex-end;background:#0a1e4a}
.fg{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px 12px}.fg>*{min-width:0}.fg .w{grid-column:1/-1}
.fg label{font-size:.82rem;color:#bcd0f4;display:block;margin-bottom:3px}
.fg input,.fg select,.fg textarea{width:100%;max-width:100%}
.fg textarea{resize:vertical}
.fg input[type=file]{padding:6px 8px;font-size:.86rem}
input[type=file]::file-selector-button{background:linear-gradient(#f6dc8a,#cf9f30);color:#10224a;border:0;border-radius:6px;padding:5px 12px;margin-right:10px;font-weight:600;cursor:pointer}
.th{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}.th span{position:relative}.th img{width:64px;height:64px;object-fit:cover;border-radius:8px;border:2px solid var(--gold)}.th button{position:absolute;top:-6px;right:-6px;width:20px;height:20px;border-radius:50%;border:0;background:#e0476b;color:#fff;cursor:pointer;line-height:1;padding:0}
#cf{width:min(420px,92vw)}#cf p{margin:0;font-size:1.02rem}
@media(max-width:1000px){.side{width:62px;padding:10px 6px}.side .brand .b1,.side .brand .b2,.side .nt,.side .deco{display:none}.brand img{width:44px;height:44px}.nav button{justify-content:center;padding:10px 6px}}
@media(max-width:820px){form{grid-template-columns:1fr 1fr}.total{grid-template-columns:1fr 1fr}.total>div:first-child{grid-column:1/-1}.wrap{padding:12px}}
@media(max-width:620px){.side{display:none}.fg{grid-template-columns:minmax(0,1fr)}}
@media(max-width:520px){th,td{padding:7px 6px;font-size:.9rem}.total .big{font-size:1.8rem}header h1{font-size:1.1rem}}
@media print{.noprint{display:none!important}}
</style>
</head>
<body>
<div class="app">
<aside class="side noprint">
  <div class="brand"><img src="icon.png" alt=""><div class="b1" id="b1"></div><div class="b2">Moi Tracker</div></div>
  <nav class="nav" id="nav">
    <button type="button" data-n="home" class="on"><svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8M5 10v10h14V10M10 20v-6h4v6"/></svg><span class="nt" data-i="nHome"></span></button>
    <button type="button" data-n="entry"><svg viewBox="0 0 24 24"><rect x="3.500" y="3.500" width="17" height="17" rx="3"/><path d="M12 8v8M8 12h8"/></svg><span class="nt" data-i="nEntry"></span></button>
    <button type="button" data-n="list"><svg viewBox="0 0 24 24"><rect x="3.500" y="3.500" width="17" height="17" rx="3"/><path d="M8 9h8M8 12.500h8M8 16h5"/></svg><span class="nt" data-i="nView"></span></button>
    <button type="button" data-n="rep"><svg viewBox="0 0 24 24"><path d="M5 20V10M12 20V4M19 20v-7"/></svg><span class="nt" data-i="nRep"></span></button>
    <button type="button" data-n="func"><svg viewBox="0 0 24 24"><rect x="3.500" y="5" width="17" height="15.500" rx="2.500"/><path d="M8 3v4M16 3v4M3.500 10h17"/></svg><span class="nt" data-i="nFunc"></span></button>
    <button type="button" data-n="set"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.200"/><path d="M12 3v2.500M12 18.500V21M3 12h2.500M18.500 12H21M5.600 5.600l1.800 1.800M16.600 16.600l1.800 1.800M5.600 18.400l1.800-1.800M16.600 7.400l1.800-1.800"/></svg><span class="nt" data-i="nSet"></span></button>
    <button type="button" data-n="bak"><svg viewBox="0 0 24 24"><path d="M7 18a4.500 4.500 0 0 1-.5-9A6 6 0 0 1 18 9.500a4 4 0 0 1-.5 8.500z"/></svg><span class="nt" data-i="nBak"></span></button>
  </nav>
  <div class="deco" aria-hidden="true"><svg viewBox="0 0 120 100"><rect x="26" y="46" width="68" height="46" rx="4" fill="#1e5fc4" stroke="#f1cf7a" stroke-width="2"/><rect x="20" y="36" width="80" height="16" rx="4" fill="#2b72dd" stroke="#f1cf7a" stroke-width="2"/><rect x="54" y="36" width="12" height="56" fill="#f1cf7a"/><path d="M60 36C44 36 36 22 46 18c8-3 14 8 14 18zM60 36C76 36 84 22 74 18c-8-3-14 8-14 18z" fill="none" stroke="#f1cf7a" stroke-width="4" stroke-linejoin="round"/><circle cx="22" cy="86" r="5" fill="#fff"/><circle cx="14" cy="80" r="4" fill="#fff"/><circle cx="30" cy="92" r="3.500" fill="#fff"/></svg></div>
</aside>
<div class="wrap" id="top">
<header>
  <h1><span id="title"></span><i id="title2"></i></h1>
  <div class="lang noprint" role="group" aria-label="Language"><button id="b-ta" data-l="ta">தமிழ்</button><button id="b-en" data-l="en">English</button></div>
</header>

<div class="bar noprint">
  <label for="fsel" data-i="func"></label>
  <select id="fsel"></select>
  <button class="btn alt sm" id="fnew" data-i="newFunc"></button>
  <button class="btn alt sm" id="fedit" data-i="fEdit"></button>
  <button class="btn alt sm" id="fdel" data-i="delFunc"></button>
  <button class="btn alt sm" id="bizBtn" data-i="bizT" style="margin-left:auto"></button>
</div>

<div class="sync noprint" id="sync"></div>
<div class="total" id="sum"></div>

<form id="f" class="noprint" autocomplete="off">
  <h3 class="ph"><svg viewBox="0 0 24 24"><path d="M4 20h4L19 9a2.800 2.800 0 0 0-4-4L4 16z"/></svg><span data-i="nEntry"></span></h3>
  <div class="ac c2"><label for="name" data-i="name"></label><input id="name" required autofocus><div class="acl" id="acn" hidden></div></div>
  <div class="ac"><label for="town" data-i="town"></label><input id="town"><div class="acl" id="act" hidden></div></div>
  <div><label for="amt" data-i="amt"></label><input id="amt" type="number" min="1" step="1" inputmode="numeric"></div>
  <div class="c2"><label for="rel" data-i="rel"></label><select id="rel"></select></div>
  <div><label for="gt" data-i="gtL"></label><select id="gt"></select></div>
  <div class="c2"><label for="gd" data-i="gdL"></label><input id="gd"></div>
  <div class="c2"><label for="note" data-i="note"></label><input id="note"></div>
  <div style="display:flex;gap:6px"><button class="btn" id="save" type="submit"></button><button class="btn alt" id="cancel" type="button" hidden data-i="cancel"></button></div>
</form>

<div class="bar noprint" id="listbar">
  <div class="tabs" id="tabs" style="margin:0"></div>
  <input id="q" type="search" style="flex:1;min-width:140px">
  <button class="btn alt sm" id="csv" data-i="csv"></button>
  <button class="btn sm" id="prn" data-i="pdf"></button>
</div>
<div class="legend"><i style="background:var(--gold)"></i><span data-i="lgTm"></span> &nbsp; <i style="background:#e0476b"></i><span data-i="lgCl"></span></div>
<div id="view"></div>
<div class="toast noprint" id="toast"></div>

<dialog id="fd" class="noprint">
 <div class="dh"><h3 data-i="fEdit"></h3></div>
 <div class="db"><div class="fg">
  <div class="w"><label data-i="dType"></label><select id="fdType"></select></div>
  <div class="w fc"><label data-i="dTn"></label><input id="fdTn"><label style="display:flex;gap:6px;align-items:center;margin-top:6px"><input type="checkbox" id="fdCouple" style="width:auto"><span data-i="dCouple"></span></label></div>
  <div class="w"><label data-i="fnL"></label><input id="fdName"></div>
  <div><label data-i="fdateL"></label><input id="fdDate"></div>
  <div><label data-i="dTime"></label><input id="fdTime"></div>
  <div class="w"><label data-i="dVenue"></label><input id="fdVenue"></div>
  <div class="w"><label data-i="dHost"></label><input id="fdHost"></div>
  <div class="fm"><label data-i="dGroom"></label><input id="fdGroom"></div>
  <div class="fm"><label data-i="dBride"></label><input id="fdBride"></div>
  <div class="fm"><label data-i="dGP"></label><input type="file" id="fdGPf" accept="image/*"><div class="th" id="tGP"></div></div>
  <div class="fm"><label data-i="dBP"></label><input type="file" id="fdBPf" accept="image/*"><div class="th" id="tBP"></div></div>
  <div class="fo w"><label data-i="dWho"></label><input id="fdWho"></div>
  <div class="fo w"><label data-i="dPh"></label><input type="file" id="fdPhf" accept="image/*" multiple><div class="th" id="tPh"></div></div>
  <div class="w"><label data-i="dCov"></label><input type="file" id="fdCovf" accept="image/*"><div class="th" id="tCov"></div></div>
  <div class="w"><label data-i="dMsg"></label><textarea id="fdMsg" rows="2"></textarea></div>
 </div></div>
 <div class="df"><button class="btn alt" id="fdNo" type="button" data-i="cancel"></button><button class="btn" id="fdOk" type="button" data-i="dSave"></button></div>
</dialog>
<dialog id="bd" class="noprint">
 <div class="dh"><h3 data-i="bizT"></h3><p class="legend" data-i="bizNote"></p></div>
 <div class="db"><div class="fg">
  <div class="w"><label data-i="bizLogo"></label><input type="file" id="bdLogof" accept="image/*"><div class="th" id="tBiz"></div></div>
  <div class="w"><label data-i="bizName"></label><input id="bdName"></div>
  <div><label data-i="bizGst"></label><input id="bdGst"></div>
  <div><label data-i="bizPh"></label><input id="bdPh"></div>
  <div class="w"><label data-i="bizAddr"></label><input id="bdAddr"></div>
 </div></div>
 <div class="df"><button class="btn alt" id="bdNo" type="button" data-i="cancel"></button><button class="btn" id="bdOk" type="button" data-i="bizSave"></button></div>
</dialog>
<dialog id="cf" class="noprint">
 <div class="db"><p id="cfm"></p></div>
 <div class="df"><button class="btn alt" id="cfNo" type="button" data-i="cancel"></button><button class="btn" id="cfOk" type="button" data-i="yes"></button></div>
</dialog>
</div>
</div>

<script src="pdfart.js"></script>
<script>
const R=[ // key, Tamil, English, close level (2 = thaimama, 1 = close relative, 0 = other)
['thaimama','தாய்மாமன்','Maternal uncle (Thaimama)',2],
['brother','அண்ணன் / தம்பி','Brother',1],
['sister','அக்கா / தங்கை','Sister',1],
['chithappa','சித்தப்பா / சித்தி','Chithappa / Chithi',1],
['periyappa','பெரியப்பா / பெரியம்மா','Periyappa / Periyamma',1],
['athai','அத்தை / மாமா','Athai / Maama',1],
['grand','தாத்தா / பாட்டி','Grandparent',1],
['relative','மற்ற உறவினர்','Other relative',0],
['friend','நண்பர்','Friend',0],
['neighbour','அக்கம்பக்கம்','Neighbour',0],
['work','அலுவலகம் / தொழில்','Colleague / Business',0],
['other','மற்றவர்','Other',0]];

function report(){
  if(!cur().length){toast(t('empty'));return}
  const f=S.funcs.find(x=>x.id===S.cur);let fr=document.getElementById('rf');if(fr)fr.remove();
  if(window.moiApp){window.moiApp.savePDF(reportHTML('parts'),'Moi-'+fname(f).replace(/[^\w\u0B80-\u0BFF-]+/g,'_')).then(r=>{if(r&&r.ok)toast('✔ PDF: '+r.path);else if(r&&r.err)toast('⚠ '+t('pdfErr')+': '+r.err)}).catch(()=>toast('⚠ '+t('pdfErr')));return}
  fr=document.createElement('iframe');fr.id='rf';fr.style.cssText='position:fixed;right:0;bottom:0;width:0;height:0;border:0';document.body.appendChild(fr);
  fr.onload=()=>setTimeout(()=>{document.title='Moi-'+fname(f).replace(/[^\w\u0B80-\u0BFF-]+/g,'_');fr.contentWindow.focus();fr.contentWindow.print();document.title=t('title')},300);
  fr.srcdoc=reportHTML()}
